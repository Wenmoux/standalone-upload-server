name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            admin-ui/package-lock.json
            cirno-src/package-lock.json
      - run: npm ci
      - run: npm --prefix admin-ui ci
      - run: npm --prefix cirno-src ci
      - run: npm run check:utf8
      - run: npm run check:schema
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm audit --omit=dev
      - run: npm --prefix admin-ui audit --omit=dev
      - run: npm --prefix cirno-src audit --omit=dev
      - run: npm run admin:build
      - run: npm --prefix cirno-src run build:standalone
      - run: npm run check:context
